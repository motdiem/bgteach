# Pocket Backgammon Teacher — static PWA served by nginx.
# No backend, no env vars. Everything (engine, analysis, history) is client-side.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Serve the .gz files produced at build time when the client accepts gzip.
    gzip_static on;
    # Also compress on the fly for anything not precompressed.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # WebAssembly must be served with the correct MIME type for streaming
    # instantiation (WebAssembly.instantiateStreaming).
    types {
        application/wasm wasm;
    }

    # Long-cache immutable, content-hashed build assets (Vite emits hashed names).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The engine wasm + Go glue are large and effectively immutable; cache hard.
    location /engine/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the service worker or the app shell, so updates roll out.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown routes serve the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
